name: Build and Test Full Project

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "dev", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: minidev-frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: minidev-frontend

    - name: Build Frontend
      run: npm run build
      working-directory: minidev-frontend

    - name: Run Frontend Tests
      run: npm test -- --watch=false --browsers=ChromeHeadless
      working-directory: minidev-frontend

    - name: Upload Frontend Build
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: minidev-backend/src/main/resources/static/

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Download Frontend Build
      uses: actions/download-artifact@v8
      with:
        name: frontend-build
        path: minidev-backend/src/main/resources/static/

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw
      working-directory: minidev-backend

    - name: Build Backend with Maven
      run: ./mvnw clean install -T 1C -DskipFrontendBuild=true
      working-directory: minidev-backend

    - name: Upload Test Report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-reports
        path: |
          minidev-backend/target/surefire-reports/
          minidev-backend/target/site/jacoco/

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: minidev-application
        path: minidev-backend/target/*.war
