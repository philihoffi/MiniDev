<nav class="navbar">
  <div class="navbar-inner">
    <!-- Left: Brand + Nav Links -->
    <div class="navbar-left">
      <a routerLink="/dashboard" class="navbar-brand">MiniDev</a>

      <!-- Desktop links -->
      <div class="navbar-links desktop-only">
        <a routerLink="/dashboard" class="nav-link" routerLinkActive="active">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"/>
          </svg>
          Dashboard
        </a>
        <a routerLink="/wallpaper-gallery" class="nav-link" routerLinkActive="active">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909M3.75 21h16.5A2.25 2.25 0 0 0 22.5 18.75V5.25A2.25 2.25 0 0 0 20.25 3H3.75A2.25 2.25 0 0 0 1.5 5.25v13.5A2.25 2.25 0 0 0 3.75 21Z"/>
          </svg>
          Wallpapers
        </a>
        @if (isAdmin) {
          <a routerLink="/user-management" class="nav-link" routerLinkActive="active">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/>
            </svg>
            Users
          </a>
        }
      </div>
    </div>

    <!-- Right: Actions + User -->
    <div class="navbar-right">
      <!-- Dark Mode Toggle -->
      <button class="icon-btn" (click)="toggleDarkMode()" [title]="isDark() ? 'Light Mode' : 'Dark Mode'">
        @if (isDark()) {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
          </svg>
        }
      </button>

      <!-- User Menu (Desktop) -->
      <div class="user-menu-wrapper desktop-only">
        <button class="user-menu-trigger" (click)="toggleUserMenu($event)">
          <div class="user-avatar">{{ displayName.charAt(0) }}</div>
          <div class="user-info">
            <span class="user-name">{{ displayName }}</span>
            <span class="user-role">{{ role }}</span>
          </div>
          <svg class="w-4 h-4 text-surface-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"/>
          </svg>
        </button>

        @if (userMenuOpen()) {
          <div class="user-dropdown">
            <button class="dropdown-item" (click)="logout()">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
              </svg>
              Logout
            </button>
          </div>
        }
      </div>

      <!-- Mobile: User initial + Hamburger -->
      <div class="mobile-only-flex">
        <div class="user-avatar-sm">{{ displayName.charAt(0) }}</div>
        <button class="icon-btn" (click)="toggleMobileMenu()">
          @if (mobileMenuOpen()) {
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
            </svg>
          }
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (mobileMenuOpen()) {
    <div class="mobile-menu">
      <a routerLink="/dashboard" class="mobile-link" (click)="mobileMenuOpen.set(false)" routerLinkActive="active">
        Dashboard
      </a>
      <a routerLink="/wallpaper-gallery" class="mobile-link" (click)="mobileMenuOpen.set(false)" routerLinkActive="active">
        Wallpapers
      </a>
      @if (isAdmin) {
        <a routerLink="/user-management" class="mobile-link" (click)="mobileMenuOpen.set(false)" routerLinkActive="active">
          User Management
        </a>
      }
      <div class="mobile-menu-footer">
        <span class="text-sm text-surface-500">{{ displayName }} ({{ role }})</span>
        <button class="btn-logout-sm" (click)="logout()">Logout</button>
      </div>
    </div>
  }
</nav>

<main class="content-area" [class.full-bleed]="isFullBleed()">
  <router-outlet></router-outlet>
</main>
