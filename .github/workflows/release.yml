name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: minidev-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: minidev-frontend

      - name: Build Frontend
        run: npm run build
        working-directory: minidev-frontend

      - name: Upload Frontend Build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: minidev-backend/src/main/resources/static/

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        run: ./mvnw clean install -T 1C -DskipFrontendBuild=true
        working-directory: minidev-backend

      - name: Upload WAR
        uses: actions/upload-artifact@v7
        with:
          name: minidev-war
          path: minidev-backend/target/*.war

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: minidev-backend/target/*.war