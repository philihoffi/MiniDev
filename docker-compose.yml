services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minidev}
      POSTGRES_USER: ${POSTGRES_USER:-minidev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minidev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    networks:
      - db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-minidev}
      POSTGRES_USER: ${POSTGRES_USER:-minidev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minidev}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - ${MINIDEV_PORT:-8080}:8080
    networks:
      - public
      - db

volumes:
  postgres-data:

networks:
  public:
  db:
    internal: true

